# code: language=ansible
---
- name: Install RabbitMQ
  community.general.zypper:
    name: "rabbitmq-server{{ '=' ~ rabbitmq_version if rabbitmq_version else '' }}"
    state: present
    update_cache: true

- name: "Configure RabbitMQ to listen on port {{ rabbitmq_port }}"
  ansible.builtin.lineinfile:
    path: /etc/rabbitmq/rabbitmq.conf
    regexp: "^listeners\\.tcp\\.default\\s*="
    line: "listeners.tcp.default = {{ rabbitmq_port }}"
    mode: "0644"
    create: true
  notify: Restart RabbitMQ

- name: Start RabbitMQ service
  ansible.builtin.service:
    name: rabbitmq-server
    state: started
    enabled: true

- name: Create RabbitMQ Trento vhost
  community.rabbitmq.rabbitmq_vhost:
    name: "{{ rabbitmq_vhost }}"
    node: "{{ rabbitmq_node_name }}"
    state: present

- name: Enable RabbitMQ management plugin (SLE 16 rabbitmqctl JSON workaround)
  ansible.builtin.copy:
    dest: /etc/rabbitmq/enabled_plugins
    content: "[rabbitmq_management].\n"
    mode: "0644"

- name: Restart RabbitMQ to load the management plugin
  ansible.builtin.service:
    name: rabbitmq-server
    state: restarted

- name: Wait for the RabbitMQ management API
  ansible.builtin.wait_for:
    port: 15672
    timeout: 30

- name: Configure rabbitmq trento user
  community.rabbitmq.rabbitmq_user:
    user: "{{ rabbitmq_username }}"
    node: "{{ rabbitmq_node_name }}"
    password: "{{ rabbitmq_password }}"
    login_host: "{{ (ansible_distribution_major_version == '16') | ternary('localhost', omit) }}"
    login_user: "{{ (ansible_distribution_major_version == '16') | ternary('guest', omit) }}"
    login_password: "{{ (ansible_distribution_major_version == '16') | ternary('guest', omit) }}"
    permissions:
      - vhost: "{{ rabbitmq_vhost }}"
        configure_priv: ".*"
        read_priv: ".*"
        write_priv: ".*"
