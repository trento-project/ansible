---
#
# Protected values -- The following values are not intended to be
# specified by end-users and are also DEPRECATED:
trento_install_method: "{{ install_method | default('rpm') }}" # `install_method` is for backwards-compatibility
trento_docker_network_name: trentonet
trento_force_pull_images: false
trento_web_container_name: trento_web
#
# -- Auto-discovery -- if `*_host_group` variable is not empty string,
# then we'll ignore the corresponding `*_host` variable and search the
# inventory for the specified group and take the first host from that
# group. We also handle the case where hostname aliases are used,
# hence the `*_inventory_host` and `_ansible_host` variables. There is
# a special case in the auto-discovery for reasons of performance and
# circumventing various network "hairpinning" scenarios -- when the
# third party applications are installed on the same host as this
# role, then we enforce the services to talk over `localhost`.

# Postgres auto-discovery
__trento_postgres_inventory_host: "{{ groups[trento_postgres_host_group][0] }}"
__trento_postgres_ansible_host: "{{ hostvars[__trento_postgres_inventory_host].ansible_host }}"
__trento_postgres_discovery_host: "{{ (inventory_hostname in groups[trento_postgres_host_group])
                                     | ternary('localhost',
                                               __trento_postgres_ansible_host | default(__trento_postgres_inventory_host)) }}"
__trento_postgres_effective_host: "{{ trento_postgres_host_group is truthy
                                    | ternary(__trento_postgres_discovery_host,
                                              trento_postgres_host) }}"

# `trento_postgres_host` has historically allowed embedding the port
# directly (eg. "myhost:5433") for backwards-compatibility. Split it
# back out here so `trento_postgres_port` remains the single source of
# truth for anything that needs the port on its own. Only a single
# colon is treated as a host:port separator, so bare (unbracketed)
# IPv6 literals -- which always contain 2+ colons -- are left alone
# rather than being mangled.
__trento_postgres_effective_host_parts: "{{ __trento_postgres_effective_host.rsplit(':', 1) }}"
trento_postgres_effective_host: >-
  {{
    __trento_postgres_effective_host_parts[0]
    if (__trento_postgres_effective_host.count(':') == 1 and __trento_postgres_effective_host_parts[1].isdigit())
    else __trento_postgres_effective_host
  }}
trento_postgres_effective_port: >-
  {{
    __trento_postgres_effective_host_parts[1]
    if (__trento_postgres_effective_host.count(':') == 1 and __trento_postgres_effective_host_parts[1].isdigit())
    else trento_postgres_port
  }}

# RabbitMQ auto-discovery
__trento_rabbitmq_inventory_host: "{{ groups[trento_rabbitmq_host_group][0] }}"
__trento_rabbitmq_ansible_host: "{{ hostvars[__trento_rabbitmq_inventory_host].ansible_host }}"
__trento_rabbitmq_discovery_host: "{{ (inventory_hostname in groups[trento_rabbitmq_host_group])
                                     | ternary('localhost',
                                               __trento_rabbitmq_ansible_host | default(__trento_rabbitmq_inventory_host)) }}"
__trento_rabbitmq_effective_host: "{{ trento_rabbitmq_host_group is truthy
                                    | ternary(__trento_rabbitmq_discovery_host,
                                              trento_rabbitmq_host) }}"

# `trento_rabbitmq_host` has historically allowed embedding the port
# directly (eg. "myhost:5673") for backwards-compatibility. Split it
# back out here so `trento_rabbitmq_port` remains the single source of
# truth for anything that needs the port on its own. Only a single
# colon is treated as a host:port separator, so bare (unbracketed)
# IPv6 literals -- which always contain 2+ colons -- are left alone
# rather than being mangled.
__trento_rabbitmq_effective_host_parts: "{{ __trento_rabbitmq_effective_host.rsplit(':', 1) }}"
trento_rabbitmq_effective_host: >-
  {{
    __trento_rabbitmq_effective_host_parts[0]
    if (__trento_rabbitmq_effective_host.count(':') == 1 and __trento_rabbitmq_effective_host_parts[1].isdigit())
    else __trento_rabbitmq_effective_host
  }}
trento_rabbitmq_effective_port: >-
  {{
    __trento_rabbitmq_effective_host_parts[1]
    if (__trento_rabbitmq_effective_host.count(':') == 1 and __trento_rabbitmq_effective_host_parts[1].isdigit())
    else trento_rabbitmq_port
  }}

# Prometheus auto-discovery
__trento_prometheus_inventory_host: "{{ groups[trento_prometheus_host_group][0] }}"
__trento_prometheus_ansible_host: "{{ hostvars[__trento_prometheus_inventory_host].ansible_host }}"
__trento_prometheus_discovery_host: "{{ (inventory_hostname in groups[trento_prometheus_host_group])
                                     | ternary('127.0.0.1',
                                               __trento_prometheus_ansible_host | default(__trento_prometheus_inventory_host)) }}"
trento_prometheus_effective_host: "{{ trento_prometheus_host_group is truthy
                                    | ternary(__trento_prometheus_discovery_host,
                                              trento_prometheus_host) }}"
