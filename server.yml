---
- name: Check if Trento would be installed on SLES
  hosts: trento_server
  become: true
  tasks:
    - name: Check SLES distribution and version
      ansible.builtin.fail:
        msg: "This playbook only runs on SLES for SAP 15 SP4 or above. Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}"
      when: >
        (ansible_distribution != "SLES_SAP") or
        (ansible_distribution_version is version('15.4', '<'))

- name: Provision Postgres
  hosts: postgres_hosts
  roles:
    - role: port_check
      become: true
      when: provision_postgres | default(true) | bool
      vars:
        port_check_port: "{{ trento_postgres_effective_port }}"
        port_check_service: postgresql
        port_check_hint: >-
          Set trento_postgres_port to a free port and re-run the playbook.
          You can also set provision_postgres=false,
          and point trento_postgres_host at an existing external PostgreSQL instance.
    - role: postgres
      become: true
      when: provision_postgres | default(true) | bool

- name: Provision Prometheus
  hosts: prometheus_hosts
  roles:
    - role: port_check
      become: true
      when: provision_prometheus | default(true) | bool
      vars:
        port_check_port: "{{ trento_prometheus_port }}"
        port_check_service: prometheus
        port_check_hint: >-
          Set trento_prometheus_port to a free port and re-run the playbook.
          Note that port 9090 is also Cockpit's default port on SLES.
    - role: prometheus
      become: true
      when: provision_prometheus | default(true) | bool

    - role: firewall
      become: true
      firewall_ports:
        - "{{ trento_prometheus_port }}/tcp"
      when: provision_prometheus | default(true) | bool


- name: Provision RabbitMQ
  hosts: rabbitmq_hosts
  roles:
    - role: port_check
      become: true
      when: provision_rabbitmq | default(true) | bool
      vars:
        port_check_port: "{{ trento_rabbitmq_effective_port }}"
        port_check_service: rabbitmq-server
        port_check_hint: >-
          Set trento_rabbitmq_port to a free port and re-run the playbook.
          You can also set provision_rabbitmq=false,
          and point trento_rabbitmq_host at an existing external RabbitMQ instance.
    - role: rabbitmq
      become: true
      when: provision_rabbitmq | default(true) | bool

- name: Configure Trento components
  hosts: trento_server
  roles:
    # Explicitly call the trento role with the passed parameters to
    # please the linter.
    - role: trento
      run_once: true
      vars:
        trento_postgres_host_group: "{{ 'postgres_hosts' if (provision_postgres | default(true) | bool) else '' }}"
        trento_rabbitmq_host_group: "{{ 'rabbitmq_hosts' if (provision_rabbitmq | default(true) | bool) else '' }}"
        trento_prometheus_host_group: "{{ 'prometheus_hosts' if (provision_prometheus | default(true) | bool) else '' }}"

    - role: web
      become: true

    - role: wanda
      become: true

    - role: port_check
      become: true
      when: provision_proxy | default(true) | bool
      vars:
        port_check_port: "{{ nginx_vhost_http_listen_port }}"
        port_check_service: nginx
        port_check_hint: >-
          Set rproxy_vhost_http_listen_port to a free port and re-run the playbook.
    - role: port_check
      become: true
      when: provision_proxy | default(true) | bool
      vars:
        port_check_port: "{{ nginx_vhost_https_listen_port }}"
        port_check_service: nginx
        port_check_hint: >-
          Set rproxy_vhost_https_listen_port to a free port and re-run the playbook.
    - role: rproxy
      become: true
      when: provision_proxy | default(true) | bool
      vars:
        rproxy_provision_prometheus: "{{ provision_prometheus | default(true) | bool }}"

    - role: firewall
      become: true
      firewall_ports:
        - "{{ rproxy_vhost_http_listen_port }}/tcp"
        - "{{ rproxy_vhost_https_listen_port }}/tcp"
      when: provision_proxy | default(true) | bool

    - role: supportutils
      become: true
