---
# Version of RabbitMQ package to install (e.g. "4.1.5"). If empty or unspecified,
# the role falls back to installing `rabbitmq-server` without pinning to a specific version.
rabbitmq_version: ""
rabbitmq_port: "{{ trento_rabbitmq_effective_port }}"
rabbitmq_username: "{{ trento_rabbitmq_username }}"
rabbitmq_password: "{{ trento_rabbitmq_password }}"
rabbitmq_vhost: "{{ trento_rabbitmq_vhost }}"
rabbitmq_node_name: "rabbit@localhost"
