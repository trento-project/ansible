# code: language=ansible
---
- name: Verify Prometheus port availability
  ansible.builtin.include_role:
    name: port_check
  vars:
    port_check_port: "{{ trento_prometheus_port }}"
    port_check_service: prometheus
    port_check_hint: >-
      Set prometheus_port (or trento_prometheus_port) to a free port and re-run the
      playbook. Note that port 9090 is also Cockpit's default port on SLES.

- name: Ensure prometheus group is present
  ansible.builtin.group:
    name: prometheus
    system: true
  when: ansible_distribution_version >= "15.4"

- name: Create Prometheus system user
  ansible.builtin.user:
    name: prometheus
    system: true
    group: prometheus
    shell: /sbin/nologin
    comment: "User for Prometheus service"
  when: ansible_distribution_version >= "15.4"

- name: Install package using zypper module
  ansible.builtin.package:
    name: golang-github-prometheus-prometheus
    state: present

- name: Check Prometheus tmpfiles config
  ansible.builtin.stat:
    path: /usr/lib/tmpfiles.d/prometheus.conf
  register: prometheus_tmpfiles_config

- name: Create Prometheus directories from tmpfiles
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create /usr/lib/tmpfiles.d/prometheus.conf
  changed_when: false
  when: prometheus_tmpfiles_config.stat.exists

- name: Create Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
    backup: true
  notify:
    - Restart Prometheus

- name: Configure prometheus startup options
  ansible.builtin.template:
    src: prometheus-sysconfig.j2
    dest: /etc/sysconfig/prometheus
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Restart Prometheus

- name: Enable prometheus service
  ansible.builtin.service:
    name: prometheus
    state: started
    enabled: true
