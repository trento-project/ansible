name: CI

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "VERSION"
  pull_request:
    paths-ignore:
      - "VERSION"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZYPPER_PACKAGES: >-
    curl
    git
    gzip
    openssh-clients
    python3
    python3-pip
    tar
    wget

jobs:
  license-header:
    name: Check license headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.TRENTOBOT_SSH_KEY }}

      - uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
        name: Check license headers

  ansible-lint:
    name: Playbook linting
    runs-on: ubuntu-24.04
    container:
      image: registry.suse.com/bci/bci-base:16.0
    steps:
      - name: Bootstrap container dependencies
        run: |
          zypper -n in -y $ZYPPER_PACKAGES

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.TRENTOBOT_SSH_KEY }}

      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run ansible-lint on main playbook
        uses: ansible/ansible-lint@262624cd0ab22a4221293216856c59671ce7aa5e # v26.6.0
        with:
          setup_python: false

      - name: List available collections
        run: |
          ansible-galaxy collection list

      - name: Run ansible-lint on devbox playbook
        uses: ansible/ansible-lint@262624cd0ab22a4221293216856c59671ce7aa5e # v26.6.0
        with:
          setup_python: false
          working_directory: "./devbox/ansible"
          requirements_file: "./requirements.yml"

      - name: List available collections
        run: |
          ansible-galaxy collection list

  container-smoke-test:
    name: Controller container smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.TRENTOBOT_SSH_KEY }}

      - name: Build and smoke-test controller container
        run: |
          docker build --file docker/Dockerfile --tag trento-ansible:ci .
          test "$(docker run --rm --entrypoint id trento-ansible:ci -u)" = "1001"
          docker run --rm --entrypoint ansible-playbook trento-ansible:ci \
            /lib/trento-ansible/playbook.yml \
            -i localhost, \
            -c local \
            --syntax-check
          docker run --rm --entrypoint ansible-playbook trento-ansible:ci \
            /lib/trento-ansible/playbook.yml \
            -i localhost, \
            -c local \
            --list-tasks

  test-deploy:
    name: Run ansible${{ matrix.control_node.ansible_version }} on ${{ matrix.install_method }}/${{ matrix.target.label }}
    needs: [ansible-lint, license-header]
    runs-on: ubuntu-24.04
    container:
      image: registry.suse.com/bci/bci-base:16.0
    concurrency:
      group: test-deploy-host-${{ matrix.target.label }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        control_node:
          - ansible_version: "11"
            target_python: python3.11
          - ansible_version: "9"
            target_python: python3
        install_method: ["rpm", "docker"]
        target:
          - label: SLES15-SP7
            host_var: TEST_SP7_HOST_IP
          - label: SLES15-SP6
            host_var: TEST_SP6_HOST_IP
          - label: SLES15-SP5
            host_var: TEST_SP5_HOST_IP
          - label: SLES15-SP4
            host_var: TEST_SP4_HOST_IP
          - label: SLES16.0
            host_var: TEST_SLES16_HOST_IP
            target_python: python3

        exclude:
          - target:
              label: SLES15-SP4
              host_var: TEST_SP4_HOST_IP
            control_node:
              ansible_version: "11"
              target_python: python3.11

          - target:
              label: SLES15-SP5
              host_var: TEST_SP5_HOST_IP
            control_node:
              ansible_version: "11"
              target_python: python3.11

    env:
      TEST_HOST_IP: ${{ vars[matrix.target.host_var] }}
      ANSIBLE_INVENTORY: |
        all:
          vars:
            ansible_user: ${{ secrets.TEST_HOST_USER }}
            ansible_python_interpreter: /usr/bin/${{ matrix.target.target_python || matrix.control_node.target_python }}
          children:
            trento_server:
              hosts:
                server:
                  ansible_host: ${{ vars[matrix.target.host_var] }}
            postgres_hosts:
              hosts:
                server:
                  ansible_host: ${{ vars[matrix.target.host_var] }}
            rabbitmq_hosts:
              hosts:
                server:
                  ansible_host: ${{ vars[matrix.target.host_var] }}
            prometheus_hosts:
              hosts:
                server:
                  ansible_host: ${{ vars[matrix.target.host_var] }}
            agents:
              hosts:
                agent:
                  ansible_host: ${{ vars[matrix.target.host_var] }}
      ANSIBLE_OPTIONS: |
        --verbose
        --extra-vars " \
        agent_server_ca_cert='${{ secrets.SERVER_CA_CERT }}' \
        agent_server_ca_cert_as_base64='true' \
        enable_api_key='false' \
        enable_suseconnect='false' \
        install_method='${{ matrix.install_method }}' \
        nginx_ssl_cert='${{ secrets.SSL_CERT }}' \
        nginx_ssl_cert_as_base64='true' \
        nginx_ssl_key='${{ secrets.SSL_KEY }}' \
        nginx_ssl_key_as_base64='true' \
        nginx_vhost_listen_port='443' \
        prometheus_url='http://localhost' \
        rabbitmq_password='trento' \
        trento_prometheus_auth='basic' \
        trento_prometheus_auth_password='prometheus-password' \
        trento_prometheus_auth_username='prometheus' \
        trento_server_name='trento-deployment.example.com' \
        wanda_postgres_password='wanda' \
        web_admin_password='adminpassword' \
        web_postgres_password='trento' \
        "

    steps:
      - name: Bootstrap container dependencies
        run: |
          zypper -n in -y $ZYPPER_PACKAGES

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.TRENTOBOT_SSH_KEY }}

      - name: Install Ansible
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir --break-system-packages pipx
          pipx install --global --force --include-deps "ansible~=${{ matrix.control_node.ansible_version }}.0"

      - name: Install galaxy deps
        run: ansible-galaxy install -r requirements.yml

      - name: Run playbook
        id: runplaybook
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        with:
          playbook: playbook.yml
          key: ${{ secrets.SSH_MACHINE_KEY }}
          inventory: ${{ env.ANSIBLE_INVENTORY }}
          options: ${{ env.ANSIBLE_OPTIONS }}

      - name: Test readiness
        run: curl -k "https://${{ env.TEST_HOST_IP }}/api/readyz"

      - name: Run playbook cleanup
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        if: always() && steps.runplaybook.conclusion != 'skipped'
        with:
          playbook: playbook.cleanup.yml
          key: ${{ secrets.SSH_MACHINE_KEY }}
          inventory: ${{ env.ANSIBLE_INVENTORY }}
          options: ${{ env.ANSIBLE_OPTIONS }}

  publish-containers:
    name: Publish GHCR Containers
    if: github.event_name == 'push'
    needs:
      - ansible-lint
      - test-deploy
      - container-smoke-test
    uses: trento-project/.github/.github/workflows/publish-containers.yaml@94dac57211d792dda649383e7f23326b24a9087b # v1.11.0
    with:
      image_name: ansible
      tag: rolling
      dockerfile: "docker/Dockerfile"
    secrets:
      gh_token: ${{ secrets.TRENTOBOT_GH_PAT }}
      ssh_key: ${{ secrets.TRENTOBOT_SSH_KEY }}

  obs-sync:
    name: Update obs packages
    if: fromJSON(vars.OBS_ENABLED) && github.event_name == 'push'
    needs:
      - ansible-lint
      - test-deploy
    uses: trento-project/.github/.github/workflows/obs-sync.yaml@94dac57211d792dda649383e7f23326b24a9087b # v1.11.0
    with:
      obs_project: ${{ vars.OBS_PROJECT_ROLLING }}
      obs_package: ${{ vars.OBS_PACKAGE }}
    secrets:
      gh_token: ${{ secrets.TRENTOBOT_GH_PAT }}
      obs_user: ${{ secrets.OBS_USER }}
      obs_pass: ${{ secrets.OBS_PASS }}
      obs_ssh_key: ${{ secrets.OBS_SSH_KEY }}

  dependabot-auto-merge:
    name: Approve and merge Dependabot PRs
    if: >
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - ansible-lint
      - test-deploy
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: trento-project/.github/.github/workflows/dependabot-auto-merge.yaml@94dac57211d792dda649383e7f23326b24a9087b # v1.11.0
