# code: language=ansible
---
- name: Verify RabbitMQ port availability
  ansible.builtin.import_role:
    name: port_check
  vars:
    port_check_port: "{{ rabbitmq_port }}"
    port_check_service: rabbitmq-server
    port_check_hint: >-
      Set trento_rabbitmq_port to a free port and re-run the playbook.
      You can also set provision_rabbitmq=false,
      and point trento_rabbitmq_host at an existing external RabbitMQ instance.

- name: Install RabbitMQ
  community.general.zypper:
    name: rabbitmq-server
    state: present
    update_cache: true

- name: "Configure RabbitMQ to listen on port {{ rabbitmq_port }}"
  ansible.builtin.lineinfile:
    path: /etc/rabbitmq/rabbitmq.conf
    regexp: "^listeners\\.tcp\\.default\\s*="
    line: "listeners.tcp.default = {{ rabbitmq_port }}"
    mode: "0644"
    create: true
  notify: Restart RabbitMQ

- name: Start RabbitMQ service
  ansible.builtin.service:
    name: rabbitmq-server
    state: started
    enabled: true

- name: Create RabbitMQ Trento vhost
  community.rabbitmq.rabbitmq_vhost:
    name: "{{ rabbitmq_vhost }}"
    node: "{{ rabbitmq_node_name }}"
    state: present

- name: Configure rabbitmq trento user
  community.rabbitmq.rabbitmq_user:
    user: "{{ rabbitmq_username }}"
    node: "{{ rabbitmq_node_name }}"
    password: "{{ rabbitmq_password }}"
    permissions:
      - vhost: "{{ rabbitmq_vhost }}"
        configure_priv: ".*"
        read_priv: ".*"
        write_priv: ".*"
