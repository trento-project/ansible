# code: language=ansible
---
- name: Normalize PostgreSQL configuration for CI
  hosts: postgres_hosts
  become: true
  tasks:
    - name: Restore PostgreSQL default port
      ansible.builtin.lineinfile:
        path: /var/lib/pgsql/data/postgresql.conf
        regexp: "^#?port\\s*="
        line: "port = 5432"
        owner: postgres
        group: postgres
      notify: Restart postgres

    - name: Remove stale PostgreSQL configuration backup
      ansible.builtin.file:
        path: /var/lib/pgsql/data/postgresql.conf.trento-backup
        state: absent

  handlers:
    - name: Restart postgres
      ansible.builtin.service:
        name: postgresql
        state: restarted

- name: Configure PostgreSQL for Trento
  hosts: postgres_hosts
  become: true
  tasks:
    - name: Read pre PostgreSQL configuration
      ansible.builtin.command:
        cmd: cat {{ item }}
      changed_when: false
      loop:
        - /var/lib/pgsql/data/postgresql.conf
        - /var/lib/pgsql/data/pg_hba.conf
      register: __postgres_pre_configuration

    - name: Show pre PostgreSQL configuration
      ansible.builtin.debug:
        var: __postgres_pre_configuration.results
    - name: Configure and diagnose PostgreSQL
      block:
        - name: Configure PostgreSQL
          ansible.builtin.include_role:
            name: postgres
      always:
        - name: Read PostgreSQL journal after configuration
          ansible.builtin.command:
            cmd: journalctl --unit postgresql --no-pager --lines 100
          changed_when: false
          register: __postgres_configuration_journal

        - name: Show PostgreSQL journal after configuration
          ansible.builtin.debug:
            var: __postgres_configuration_journal.stdout_lines
    - name: Read restored PostgreSQL configuration
      ansible.builtin.command:
        cmd: cat {{ item }}
      changed_when: false
      loop:
        - /var/lib/pgsql/data/postgresql.conf
        - /var/lib/pgsql/data/pg_hba.conf
      register: __postgres_post_configuration

    - name: Show post PostgreSQL configuration
      ansible.builtin.debug:
        var: __postgres_post_configuration.results
- name: Clean up PostgreSQL for Trento
  hosts: postgres_hosts
  become: true
  tasks:
    - name: Clean up PostgreSQL
      ansible.builtin.import_role:
        name: postgres
        tasks_from: cleanup

    - name: Read restored PostgreSQL configuration
      ansible.builtin.command:
        cmd: cat {{ item }}
      changed_when: false
      loop:
        - /var/lib/pgsql/data/postgresql.conf
        - /var/lib/pgsql/data/pg_hba.conf
      register: __postgres_configuration

    - name: Show restored PostgreSQL configuration
      ansible.builtin.debug:
        var: __postgres_configuration.results

    - name: Read PostgreSQL journal
      ansible.builtin.command:
        cmd: journalctl --unit postgresql --no-pager --lines 100
      changed_when: false
      register: __postgres_journal

    - name: Show PostgreSQL journal
      ansible.builtin.debug:
        var: __postgres_journal.stdout_lines
