# code: language=ansible
---
- name: Ensure prometheus group is present
  ansible.builtin.group:
    name: prometheus
    system: true
  when: ansible_distribution_version >= "15.4"

- name: Create Prometheus system user
  ansible.builtin.user:
    name: prometheus
    system: true
    group: prometheus
    shell: /sbin/nologin
    comment: "User for Prometheus service"
  when: ansible_distribution_version >= "15.4"

- name: Install Prometheus package
  ansible.builtin.package:
    name: golang-github-prometheus-prometheus
    state: present
  register: prometheus_package_install_result
  ignore_errors: true

- name: Fail when Prometheus cannot be installed
  ansible.builtin.fail:
    msg: >-
      Failed to install golang-github-prometheus-prometheus:
      {{ prometheus_package_install_result.msg | default(prometheus_package_install_result) }}.
      If SUSE Package Hub is not registered on this host, set
      enable_suseconnect: true in the inventory and rerun this playbook.
  when: prometheus_package_install_result.failed | default(false)

- name: Check Prometheus tmpfiles config
  ansible.builtin.stat:
    path: /usr/lib/tmpfiles.d/prometheus.conf
  register: prometheus_tmpfiles_config

- name: Create Prometheus directories from tmpfiles
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create /usr/lib/tmpfiles.d/prometheus.conf
  changed_when: false
  when: prometheus_tmpfiles_config.stat.exists

- name: Create Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
    backup: true
  notify:
    - Restart Prometheus

- name: Configure prometheus startup options
  ansible.builtin.template:
    src: prometheus-sysconfig.j2
    dest: /etc/sysconfig/prometheus
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Restart Prometheus

- name: Enable prometheus service
  ansible.builtin.service:
    name: prometheus
    state: started
    enabled: true
