# code: language=ansible
---
- name: Reset PostgreSQL configuration for CI
  hosts: postgres_hosts
  become: true
  tasks:
    - name: Restore PostgreSQL default port
      ansible.builtin.lineinfile:
        path: /var/lib/pgsql/data/postgresql.conf
        regexp: "^#?port\\s*="
        line: "port = 5432"
      notify: Restart postgres

    - name: Remove stale PostgreSQL configuration backup
      ansible.builtin.file:
        path: /var/lib/pgsql/data/postgresql.conf.trento-backup
        state: absent

  handlers:
    - name: Restart postgres
      ansible.builtin.service:
        name: postgresql
        state: restarted
