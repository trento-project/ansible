name: CI

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "VERSION"
  pull_request:
    paths-ignore:
      - "VERSION"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible-lint:
    name: Playbook linting
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.TRENTOBOT_SSH_KEY }}

      - uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
        name: Check license headers

      - name: Run ansible-lint on main playbook
        uses: ansible/ansible-lint@262624cd0ab22a4221293216856c59671ce7aa5e # v26.6.0

      - name: List available collections
        run: |
          ansible-galaxy collection list

      - name: Run ansible-lint on devbox playbook
        uses: ansible/ansible-lint@262624cd0ab22a4221293216856c59671ce7aa5e # v26.6.0
        with:
          setup_python: false
          working_directory: "./devbox/ansible"
          requirements_file: "./requirements.yml"

      - name: List available collections
        run: |
          ansible-galaxy collection list

  test-deploy:
    name: Run ansible${{ matrix.control_node.ansible_version }} on ${{ matrix.install_method }}/${{ matrix.target.label }}
    needs: [ansible-lint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    concurrency:
      group: test-deploy-host-${{ matrix.target.label }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        control_node:
          - ansible_version: "11"
            target_python: python3.11
          - ansible_version: "9"
            target_python: python3
        install_method: ["rpm", "docker"]
        target:
          - label: SLES15-SP7
            host_var: TEST_SP7_HOST_IP
          - label: SLES15-SP6
            host_var: TEST_SP6_HOST_IP
          - label: SLES15-SP5
            host_var: TEST_SP5_HOST_IP
          - label: SLES15-SP4
            host_var: TEST_SP4_HOST_IP
          - label: SLES16.0
            host_var: TEST_SLES16_HOST_IP
            target_python: python3

        exclude:
          - target:
              label: SLES15-SP4
              host_var: TEST_SP4_HOST_IP
            control_node:
              ansible_version: "11"
              target_python: python3.11

          - target:
              label: SLES15-SP5
              host_var: TEST_SP5_HOST_IP
            control_node:
              ansible_version: "11"
              target_python: python3.11

    env:
      TEST_HOST_IP: ${{ vars[matrix.target.host_var] }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.TRENTOBOT_SSH_KEY }}

      - name: Install Ansible
        run: sudo pipx install --force --include-deps "ansible~=${{ matrix.control_node.ansible_version }}.0"

      - name: Install galaxy deps
        run: ansible-galaxy install -r requirements.yml

      - name: Test PostgreSQL configuration lifecycle
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        with:
          playbook: playbook.reset-postgres.yml
          key: ${{ secrets.SSH_MACHINE_KEY }}
          inventory: |
            all:
              vars:
                ansible_user: ${{ secrets.TEST_HOST_USER }}
                ansible_python_interpreter: /usr/bin/${{ matrix.target.target_python || matrix.control_node.target_python }}
              children:
                postgres_hosts:
                  hosts:
                    server:
                      ansible_host: ${{ env.TEST_HOST_IP }}
          options: |
            --extra-vars "web_postgres_password='trento' \
            wanda_postgres_password='wanda' \
            trento_postgres_port='5499'"

      - name: Run playbook
        id: runplaybook
        if: ${{ false }}
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        with:
          playbook: playbook.yml
          key: ${{ secrets.SSH_MACHINE_KEY }}
          inventory: |
            all:
              vars:
                ansible_user: ${{ secrets.TEST_HOST_USER }}
                ansible_python_interpreter: /usr/bin/${{ matrix.target.target_python || matrix.control_node.target_python }}
              children:
                trento_server:
                  hosts:
                    server:
                      ansible_host: ${{ env.TEST_HOST_IP }}
                postgres_hosts:
                  hosts:
                    server:
                      ansible_host: ${{ env.TEST_HOST_IP }}
                rabbitmq_hosts:
                  hosts:
                    server:
                      ansible_host: ${{ env.TEST_HOST_IP }}
                prometheus_hosts:
                  hosts:
                    server:
                      ansible_host: ${{ env.TEST_HOST_IP }}
                agents:
                  hosts:
                    agent:
                      ansible_host: ${{ env.TEST_HOST_IP }}
          options: |
            --extra-vars "web_postgres_password='trento' \
            wanda_postgres_password='wanda' \
            rabbitmq_password='trento' \
            prometheus_url='http://localhost' \
            trento_server_name='trento-deployment.example.com' \
            web_admin_password='adminpassword' \
            enable_api_key='false' \
            nginx_vhost_listen_port='443' \
            nginx_ssl_cert_as_base64='true' \
            nginx_ssl_key_as_base64='true' \
            nginx_ssl_cert='${{ secrets.SSL_CERT }}' \
            nginx_ssl_key='${{ secrets.SSL_KEY }}' \
            agent_server_ca_cert='${{ secrets.SERVER_CA_CERT }}' \
            agent_server_ca_cert_as_base64='true' \
            install_method='${{ matrix.install_method }}' \
            trento_prometheus_auth='basic' \
            trento_prometheus_auth_username='prometheus' \
            trento_prometheus_auth_password='prometheus-password' \
            trento_postgres_port='5499' \
            trento_rabbitmq_port='5699'"
            --verbose
          # FIXME: ^^^^^^ ports are hardcoded for a CI test run, revert this change
      - name: Test readiness
        if: steps.runplaybook.conclusion == 'success'
        run: curl -k "https://${{ env.TEST_HOST_IP }}/api/readyz"

      - name: Run playbook cleanup
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        if: always() && steps.runplaybook.conclusion != 'skipped'
        with:
          playbook: playbook.cleanup.yml
          key: ${{ secrets.SSH_MACHINE_KEY }}
          inventory: |
            all:
              vars:
                ansible_user: ${{ secrets.TEST_HOST_USER }}
                ansible_python_interpreter: /usr/bin/${{ matrix.target.target_python || matrix.control_node.target_python }}
              children:
                trento_server:
                  hosts:
                    server:
                      ansible_host: ${{ env.TEST_HOST_IP }}
                postgres_hosts:
                  hosts:
                    server:
                      ansible_host: ${{ env.TEST_HOST_IP }}
                rabbitmq_hosts:
                  hosts:
                    server:
                      ansible_host: ${{ env.TEST_HOST_IP }}
                prometheus_hosts:
                  hosts:
                    server:
                      ansible_host: ${{ env.TEST_HOST_IP }}
          options: |
            --extra-vars "web_postgres_password='trento' \
            wanda_postgres_password='wanda' \
            rabbitmq_password='trento' \
            prometheus_url='http://localhost' \
            trento_server_name='trento-deployment.example.com' \
            web_admin_password='adminpassword' \
            enable_api_key='false' \
            nginx_vhost_listen_port='443' \
            nginx_ssl_cert_as_base64='true' \
            nginx_ssl_key_as_base64='true' \
            nginx_ssl_cert='${{ secrets.SSL_CERT }}' \
            nginx_ssl_key='${{ secrets.SSL_KEY }}' \
            install_method='${{ matrix.install_method }}' \
            trento_postgres_port='5499' \
            trento_rabbitmq_port='5699'"
            --verbose

  publish-containers:
    name: Publish GHCR Containers
    if: github.event_name == 'push'
    needs:
      - ansible-lint
      - test-deploy
    uses: trento-project/.github/.github/workflows/publish-containers.yaml@d8679bc6bc759e119793a2d59285098613f52055 # v1.10.0
    with:
      image_name: ansible
      tag: rolling
      dockerfile: "docker/Dockerfile"
    secrets:
      gh_token: ${{ secrets.TRENTOBOT_GH_PAT }}
      ssh_key: ${{ secrets.TRENTOBOT_SSH_KEY }}

  obs-sync:
    name: Update obs packages
    if: fromJSON(vars.OBS_ENABLED) && github.event_name == 'push'
    needs:
      - ansible-lint
      - test-deploy
    uses: trento-project/.github/.github/workflows/obs-sync.yaml@d8679bc6bc759e119793a2d59285098613f52055 # v1.10.0
    with:
      obs_project: ${{ vars.OBS_PROJECT_ROLLING }}
      obs_package: ${{ vars.OBS_PACKAGE }}
    secrets:
      gh_token: ${{ secrets.TRENTOBOT_GH_PAT }}
      obs_user: ${{ secrets.OBS_USER }}
      obs_pass: ${{ secrets.OBS_PASS }}
      obs_ssh_key: ${{ secrets.OBS_SSH_KEY }}

  dependabot-auto-merge:
    name: Approve and merge Dependabot PRs
    if: >
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - ansible-lint
      - test-deploy
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: trento-project/.github/.github/workflows/dependabot-auto-merge.yaml@d8679bc6bc759e119793a2d59285098613f52055 # v1.10.0
